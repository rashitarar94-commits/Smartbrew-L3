{% extends "base.html" %}
{% block title %}Log in – SmartBrew AI{% endblock %}
{% block content %}
<h1>Log in</h1>
<div class="two-col">
  <form class="card stack" method="post" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
    <h2>With credentials</h2>
    <label>Username or email <input name="login" required autocomplete="username"></label>
    <label>Password <input name="password" type="password" required autocomplete="current-password"></label>
    <button class="btn primary">Log in</button>
    <p class="small">No account? <a href="{{ url_for('auth.register') }}">Register</a></p>
  </form>
  <form class="card stack" method="post" action="{{ url_for('auth.login_nfc') }}">
    <h2>📶 Tap NFC card</h2>
    <p class="small">The NFC reader is simulated: type or scan the card UID (hex), then "Tap".</p>
    <label>Card UID <input name="card_uid" placeholder="e.g. 04AA11BB" required autocomplete="off"></label>
    <button class="btn">Tap card</button>
  </form>
</div>
{% endblock %}
